<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }
    .container { max-width: 520px; margin: 0 auto; padding: 2.5rem 1rem; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: .25rem; }
    .subtitle { color: #666; margin-bottom: 2rem; font-size: .95rem; }
    .card { background: #fff; border-radius: 12px; padding: 1.5rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 1rem; }
    label { display: block; font-weight: 600; margin-bottom: .5rem; font-size: .9rem; }
    input[type=text] { width: 100%; padding: .75rem 1rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; outline: none; transition: border .2s; }
    input[type=text]:focus { border-color: #6c63ff; }
    .welcome { display: none; background: #f0fdf4; border: 1px solid #86efac; border-radius: 8px; padding: .6rem 1rem; margin-top: .6rem; font-size: .88rem; color: #166534; }
    .welcome.show { display: block; }
    .topics { display: grid; grid-template-columns: repeat(4, 1fr); gap: .5rem; }
    .topic { background: #fafafa; border-radius: 10px; padding: .9rem .4rem; text-align: center; cursor: pointer; border: 2px solid transparent; transition: all .15s; }
    .topic:hover, .topic.selected { border-color: #6c63ff; background: #f0eeff; }
    .topic .icon { font-size: 1.5rem; display: block; margin-bottom: .25rem; }
    .topic .name { font-size: .75rem; font-weight: 600; }
    .n-row { display: flex; gap: .5rem; margin-top: .6rem; }
    .n-btn { flex: 1; padding: .55rem; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; font-size: .9rem; font-weight: 600; cursor: pointer; text-align: center; transition: all .15s; }
    .n-btn.selected { border-color: #6c63ff; background: #f0eeff; color: #6c63ff; }
    .btn { display: block; width: 100%; padding: .85rem; background: #6c63ff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; text-align: center; text-decoration: none; }
    .btn:hover:not(:disabled) { background: #574fd6; }
    .btn:disabled { opacity: .45; cursor: default; }
    .btn-outline { background: transparent; color: #6c63ff; border: 2px solid #6c63ff; margin-top: .75rem; }
    .btn-outline:hover { background: #f0eeff; }
    .error-msg { color: #dc2626; font-size: .83rem; margin-top: .4rem; display: none; }
    .error-msg.show { display: block; }
  </style>
</head>
<body>
<div class="container">
  <h1>Adaptive Learning</h1>
  <p class="subtitle">Персонализированные уроки — 7 класс</p>

  <div class="card">
    <label for="nameInput">Твоё имя</label>
    <input type="text" id="nameInput" placeholder="Введи своё имя" maxlength="60" autocomplete="off"
      onkeydown="if(event.key==='Enter') startLesson()"
      oninput="onNameInput()">
    <div class="welcome" id="welcomeMsg"></div>
    <div class="error-msg" id="nameError">Пожалуйста, введи своё имя</div>
    <button onclick="switchStudent()" id="switchBtn"
      style="display:none;margin-top:.75rem;width:100%;padding:.6rem;background:#fff;border:2px solid #e0e0e0;border-radius:8px;font-size:.85rem;font-weight:600;color:#666;cursor:pointer;">
      Другой ученик →
    </button>
  </div>

  <div class="card">
    <label>Предмет <span style="font-weight:400;color:#999">(необязательно)</span></label>
    <div class="topics">
      <div class="topic selected" onclick="selectTopic(this,'')">
        <span class="icon">🎯</span><span class="name">Все</span>
      </div>
      <div class="topic" onclick="selectTopic(this,'1')">
        <span class="icon">➗</span><span class="name">Матем.</span>
      </div>
      <div class="topic" onclick="selectTopic(this,'2')">
        <span class="icon">🧩</span><span class="name">Логика</span>
      </div>
      <div class="topic" onclick="selectTopic(this,'3')">
        <span class="icon">🇬🇧</span><span class="name">Англ.</span>
      </div>
    </div>
    <label style="margin-top:1rem">Количество вопросов</label>
    <div class="n-row">
      <div class="n-btn" onclick="selectN(this,5)">5</div>
      <div class="n-btn selected" onclick="selectN(this,10)">10</div>
      <div class="n-btn" onclick="selectN(this,20)">20</div>
    </div>
  </div>

  <button class="btn" id="startBtn" onclick="startLesson()">Начать урок →</button>
  <a class="btn btn-outline" href="/dashboard.html">Мой прогресс</a>
</div>

<script>
  let selectedTopic = '';
  let selectedN = 10;

  const saved = JSON.parse(localStorage.getItem('studentData') || 'null');
  if (saved) {
    document.getElementById('nameInput').value = saved.name;
    document.getElementById('switchBtn').style.display = 'block';
    showWelcome(saved.name);
  }

  function onNameInput() {
    const name = document.getElementById('nameInput').value.trim();
    if (saved && name.toLowerCase() !== saved.name.toLowerCase()) {
      document.getElementById('welcomeMsg').className = 'welcome';
    }
  }

  function switchStudent() {
    localStorage.removeItem('studentData');
    document.getElementById('nameInput').value = '';
    document.getElementById('welcomeMsg').className = 'welcome';
    document.getElementById('switchBtn').style.display = 'none';
    document.getElementById('nameInput').focus();
  }

  function selectTopic(el, id) {
    document.querySelectorAll('.topic').forEach(t => t.classList.remove('selected'));
    el.classList.add('selected');
    selectedTopic = id;
  }

  function selectN(el, n) {
    document.querySelectorAll('.n-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedN = n;
  }

  function showWelcome(name) {
    const el = document.getElementById('welcomeMsg');
    el.textContent = `С возвращением, ${name}!`;
    el.className = 'welcome show';
  }

  async function startLesson() {
    const name = document.getElementById('nameInput').value.trim();
    const errEl = document.getElementById('nameError');
    if (!name) { errEl.classList.add('show'); return; }
    errEl.classList.remove('show');

    const btn = document.getElementById('startBtn');
    btn.disabled = true;
    btn.textContent = 'Загрузка...';

    try {
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ name, grade: 7 })
      });
      const data = await res.json();
      if (!res.ok) throw new Error(data.detail || 'Ошибка входа');

      localStorage.setItem('studentData', JSON.stringify({
        student_id: data.student_id,
        name: data.name,
        grade: 7,
      }));

      showWelcome(data.name);
      document.getElementById('switchBtn').style.display = 'block';

      const params = new URLSearchParams({ n: selectedN });
      if (selectedTopic) params.set('topic_id', selectedTopic);
      window.location.href = `/lesson.html?${params}`;

    } catch (e) {
      btn.disabled = false;
      btn.textContent = 'Начать урок →';
      alert('Ошибка: ' + e.message);
    }
  }
</script>
</body>
</html>
