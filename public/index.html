<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Adaptive Learning</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: system-ui, sans-serif; background: #f5f7fa; color: #1a1a2e; min-height: 100vh; }
    .container { max-width: 640px; margin: 0 auto; padding: 2rem 1rem; }
    h1 { font-size: 2rem; font-weight: 700; margin-bottom: .25rem; }
    .subtitle { color: #666; margin-bottom: 2.5rem; }
    .card { background: #fff; border-radius: 12px; padding: 2rem; box-shadow: 0 2px 12px rgba(0,0,0,.08); margin-bottom: 1.5rem; }
    label { display: block; font-weight: 600; margin-bottom: .5rem; font-size: .9rem; }
    input[type=text] { width: 100%; padding: .75rem 1rem; border: 2px solid #e0e0e0; border-radius: 8px; font-size: 1rem; outline: none; transition: border .2s; }
    input[type=text]:focus { border-color: #6c63ff; }
    .btn { display: block; width: 100%; padding: .85rem; background: #6c63ff; color: #fff; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: background .2s; margin-top: 1rem; text-align: center; text-decoration: none; }
    .btn:hover { background: #574fd6; }
    .btn-outline { background: transparent; color: #6c63ff; border: 2px solid #6c63ff; margin-top: .75rem; }
    .btn-outline:hover { background: #f0eeff; }
    .topics { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1rem; margin-bottom: 1.5rem; }
    .topic { background: #fff; border-radius: 10px; padding: 1.25rem 1rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,.07); cursor: pointer; border: 2px solid transparent; transition: all .2s; }
    .topic:hover, .topic.selected { border-color: #6c63ff; background: #f0eeff; }
    .topic .icon { font-size: 2rem; display: block; margin-bottom: .4rem; }
    .topic .name { font-size: .85rem; font-weight: 600; }
    .n-questions { display: flex; gap: .75rem; margin-top: .75rem; }
    .n-btn { flex: 1; padding: .6rem; border: 2px solid #e0e0e0; border-radius: 8px; background: #fff; font-size: .9rem; font-weight: 600; cursor: pointer; text-align: center; transition: all .2s; }
    .n-btn.selected { border-color: #6c63ff; background: #f0eeff; color: #6c63ff; }
    .hint { font-size: .8rem; color: #999; margin-top: .5rem; }
  </style>
</head>
<body>
<div class="container">
  <h1>Adaptive Learning</h1>
  <p class="subtitle">Персонализированные уроки для 7 класса (Казахстан)</p>

  <div class="card">
    <label for="name">Твоё имя</label>
    <input type="text" id="name" placeholder="Алибек" maxlength="60">
    <p class="hint" style="margin-top:.5rem">Используется для сохранения прогресса</p>
  </div>

  <div class="card">
    <label>Предмет <span style="font-weight:400;color:#999">(необязательно)</span></label>
    <div class="topics" id="topics">
      <div class="topic" data-id="" onclick="selectTopic(this, '')">
        <span class="icon">🎯</span><span class="name">Все</span>
      </div>
      <div class="topic" data-id="1" onclick="selectTopic(this, '1')">
        <span class="icon">➗</span><span class="name">Математика</span>
      </div>
      <div class="topic" data-id="2" onclick="selectTopic(this, '2')">
        <span class="icon">🧩</span><span class="name">Логика</span>
      </div>
      <div class="topic" data-id="3" onclick="selectTopic(this, '3')">
        <span class="icon">🇬🇧</span><span class="name">Английский</span>
      </div>
    </div>

    <label>Количество вопросов</label>
    <div class="n-questions" id="nQuestions">
      <div class="n-btn" data-n="5"  onclick="selectN(this, 5)">5</div>
      <div class="n-btn selected" data-n="10" onclick="selectN(this, 10)">10</div>
      <div class="n-btn" data-n="20" onclick="selectN(this, 20)">20</div>
    </div>
  </div>

  <button class="btn" onclick="startLesson()">Начать урок →</button>
  <a class="btn btn-outline" href="/dashboard.html">Мой прогресс</a>
</div>

<script>
  let selectedTopic = '';
  let selectedN = 10;

  // Restore name from localStorage
  const savedName = localStorage.getItem('studentName');
  if (savedName) document.getElementById('name').value = savedName;

  function selectTopic(el, id) {
    document.querySelectorAll('.topic').forEach(t => t.classList.remove('selected'));
    el.classList.add('selected');
    selectedTopic = id;
  }

  function selectN(el, n) {
    document.querySelectorAll('.n-btn').forEach(b => b.classList.remove('selected'));
    el.classList.add('selected');
    selectedN = n;
  }

  function startLesson() {
    const name = document.getElementById('name').value.trim() || 'Студент';
    localStorage.setItem('studentName', name);
    // For demo: student_id is always 1. In production, you'd look up by name.
    const params = new URLSearchParams({ n: selectedN });
    if (selectedTopic) params.set('topic_id', selectedTopic);
    window.location.href = `/lesson.html?${params}`;
  }
</script>
</body>
</html>
